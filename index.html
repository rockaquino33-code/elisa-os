<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELISA OS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:#000;
}

.desktop{
width:100vw;
height:100vh;

background:
linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070');

background-size:cover;
background-position:center;
position:relative;
}

/* Barra */

.taskbar{

position:absolute;
bottom:0;
left:0;

width:100%;
height:65px;

background:rgba(10,10,20,0.7);

backdrop-filter:blur(10px);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 20px;

border-top:
1px solid rgba(255,255,255,0.1);

}

/* Botão Elisa */

.start{

background:#2563eb;

padding:10px 18px;

border-radius:12px;

color:white;

font-weight:bold;

cursor:pointer;

transition:0.2s;
}

.start:hover{
transform:scale(1.03);
}

/* Relógio */

.clock{
color:white;
font-size:18px;
}

/* Ícones */

.icons{

padding:20px;

display:flex;
flex-direction:column;
gap:25px;

}

.icon{

width:90px;

text-align:center;

color:white;

cursor:pointer;

transition:0.2s;

}

.icon:hover{
transform:scale(1.05);
}

.icon img{

width:64px;
height:64px;

margin-bottom:8px;

}

/* Janela */

.window{

position:absolute;

top:90px;
left:50%;
transform:translateX(-50%);

width:90%;
max-width:700px;

height:420px;

background:rgba(15,15,25,0.95);

border-radius:18px;

display:none;

flex-direction:column;

overflow:hidden;

box-shadow:
0 0 40px rgba(0,0,0,0.5);

}

/* Topo */

.window-header{

height:50px;

background:#111827;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 15px;

color:white;

}

/* Fechar */

.close{

width:20px;
height:20px;

border-radius:50%;

background:red;

cursor:pointer;

}

/* Conteúdo */

.window-content{

flex:1;

padding:20px;

color:white;

overflow:auto;

}

.window-content h1{
margin-bottom:15px;
}

.window-content p{
line-height:1.5;
}

ul{
margin-top:15px;
padding-left:20px;
}

li{
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="desktop">

<div class="icons">

<div class="icon"
onclick="openWindow()">

<img src="https://cdn-icons-png.flaticon.com/512/732/732212.png">

<p>Navegador</p>

</div>

<div class="icon">

<img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png">

<p>Xbox</p>

</div>

<div class="icon">

<img src="https://cdn-icons-png.flaticon.com/512/5968/5968267.png">

<p>ELISA IA</p>

</div>

</div>

<!-- Janela -->

<div class="window" id="window">

<div class="window-header">

<span>ELISA Browser</span>

<div class="close"
onclick="closeWindow()"></div>

</div>

<div class="window-content">

<h1>ELISA OS</h1>

<p>
Sistema operacional cloud futurista criado por
Fábio Aquino Banachi.
</p>

<ul>

<li>Desktop futurista</li>

<li>Cloud apps</li>

<li>IA integrada</li>

<li>Temas gamer</li>

<li>Xbox Cloud Gaming</li>

<li>Sistema web multiplataforma</li>

</ul>

</div>

</div>

<!-- Barra -->

<div class="taskbar">

<div class="start">

ELISA

</div>

<div class="clock" id="clock"></div>

</div>

</div>

<script>

/* relógio */

function updateClock(){

const now = new Date();

const time =
now.toLocaleTimeString(
'pt-BR',
{
hour:'2-digit',
minute:'2-digit'
}
);

document
.getElementById('clock')
.innerText = time;

}

setInterval(updateClock,1000);

updateClock();

/* abrir janela */

function openWindow(){

document
.getElementById('window')
.style.display='flex';

}

/* fechar janela */

function closeWindow(){

document
.getElementById('window')
.style.display='none';

}

</script>

</body>
</html>
