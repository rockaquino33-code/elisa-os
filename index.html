<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="ELISA OS - Operating System Interface with modular architecture">
    
    <title>ELISA OS - Modular Operating System</title>
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/desktop.css">
    <link rel="stylesheet" href="styles/windows.css">
    <link rel="stylesheet" href="styles/dock.css">
    <link rel="stylesheet" href="styles/widgets.css">
</head>
<body>
    <!-- Main OS Container -->
    <div id="os-container" class="os-container">
        
        <!-- Desktop Area -->
        <div id="desktop" class="desktop">
            <!-- Desktop Icons will be rendered here -->
            <div id="desktop-icons" class="desktop-icons"></div>
            
            <!-- Wallpaper Background -->
            <div class="desktop-wallpaper"></div>
        </div>
        
        <!-- Windows Manager Container -->
        <div id="windows-container" class="windows-container">
            <!-- Windows will be rendered dynamically here -->
        </div>
        
        <!-- Widgets Container -->
        <div id="widgets-container" class="widgets-container">
            <!-- Widgets will be rendered here -->
        </div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <!-- Sidebar widgets and content -->
            </div>
        </aside>
        
        <!-- Dock -->
        <div id="dock" class="dock">
            <div class="dock-content">
                <!-- Dock apps will be rendered here -->
            </div>
        </div>
        
        <!-- Task Bar -->
        <div id="taskbar" class="taskbar">
            <div class="taskbar-content">
                <!-- Task bar items -->
            </div>
        </div>
    </div>
    
    <!-- Core System Scripts -->
    <script src="scripts/system.js"></script>
    <script src="scripts/desktop.js"></script>
    <script src="scripts/windows.js"></script>
    <script src="scripts/dock.js"></script>
    <script src="scripts/apps.js"></script>
    
    <!-- App Modules -->
    <script src="apps/browser/browser.js"></script>
    <script src="apps/assistant/assistant.js"></script>
    <script src="apps/explorer/explorer.js"></script>
    <script src="apps/xbox/xbox.js"></script>
    <script src="apps/settings/settings.js"></script>
</body>
</html>
