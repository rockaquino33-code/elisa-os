<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELISA OS</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#050816,#0b1b3a,#112b5c);
      height:100vh;
      overflow:hidden;
      color:white;
    }

    .desktop{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      flex-direction:column;
    }

    h1{
      font-size:50px;
      text-shadow:0 0 20px #00aaff;
    }

    p{
      opacity:0.8;
      font-size:20px;
    }

    .taskbar{
      position:fixed;
      bottom:0;
      width:100%;
      height:60px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      display:flex;
      align-items:center;
      padding-left:20px;
    }

    .start{
      width:40px;
      height:40px;
      border-radius:10px;
      background:#00aaff;
      box-shadow:0 0 15px #00aaff;
    }
  </style>
</head>

<body>

<div class="desktop">
  <h1>ELISA OS</h1>
  <p>Futuristic Cloud Desktop Platform</p>
</div>

<div class="taskbar">
  <div class="start"></div>
</div>

</body>
</html>
